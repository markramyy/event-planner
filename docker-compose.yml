services:
  mongodb:
    image: mongo:7
    container_name: eventplanner-mongodb
    restart: always
    ports:
      - "27018:27017"  # Changed to avoid conflict
    volumes:
      - mongodb_data:/data/db
    networks:
      - eventplanner-network

  backend:
    build:
      context: ./eventplanner-backend
      dockerfile: Dockerfile
    container_name: eventplanner-backend
    restart: always
    ports:
      - "5001:5000"  # Changed to 5001 externally, 5000 internally
    environment:
      - MONGO_URI=mongodb://mongodb:27017/eventplanner
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production
      - FLASK_ENV=production
    depends_on:
      - mongodb
    networks:
      - eventplanner-network

  frontend:
    build:
      context: ./eventplanner-frontend
      dockerfile: Dockerfile
    container_name: eventplanner-frontend
    restart: always
    ports:
      - "3001:80"  # Changed to 3001 to avoid conflict with local React
    depends_on:
      - backend
    networks:
      - eventplanner-network

volumes:
  mongodb_data:
    driver: local

networks:
  eventplanner-network:
    driver: bridge
